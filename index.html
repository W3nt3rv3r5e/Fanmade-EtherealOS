<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EtherealOS</title>
    
    <!-- Official Favicon Link -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>
        :root {
            --bg-color: #BC13FE;
            --bg-detail: #000000;
            --accent: #00F0FF;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Custom rodless cursor reference */
            cursor: url('assets/ui/cursor.svg') 3 2, auto;
            user-select: none;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
        }

        /* --- Boot Animation --- */
        #boot-screen {
            position: fixed;
            inset: 0;
            background: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: var(--bg-color);
            font-family: 'Courier New', monospace;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid transparent;
            border-top-color: var(--bg-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Desktop --- */
        #desktop {
            height: 100%;
            background: linear-gradient(135deg, var(--bg-detail) 0%, var(--bg-color) 100%);
            display: none; /* Shown after boot */
            position: relative;
        }

        /* --- Window Styles --- */
        .window {
            position: absolute;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--bg-color);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 300px;
            transition: var(--transition);
        }

        .window-header {
            padding: 10px;
            background: rgba(188, 19, 254, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(188, 19, 254, 0.3);
        }

        .window-controls { display: flex; gap: 8px; }

        .btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }
        .btn-min { background: #ffbd2e; }
        .btn-max { background: #27c93f; }
        .btn-close { background: #ff5f56; }

        .maximized {
            inset: 0 !important;
            width: 100% !important;
            height: calc(100% - 45px) !important;
            border-radius: 0;
        }

        .minimized {
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }

        /* --- Start Menu --- */
        #start-menu {
            position: absolute;
            bottom: 50px;
            left: 10px;
            width: 400px;
            height: 500px;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid var(--bg-color);
            border-radius: 12px;
            transform: translateY(120%);
            transition: var(--transition);
            z-index: 500;
        }

        #start-menu.open { transform: translateY(0); }

        /* --- Taskbar --- */
        .taskbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45px;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            padding: 0 10px;
            z-index: 1000;
        }

        .start-btn {
            background: var(--bg-color);
            color: black;
            padding: 5px 15px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 20px;
        }
    </style>
</head>
<body>

    <!-- Boot Animation Section -->
    <div id="boot-screen">
        <div class="loader"></div>
        <h1>Ethereal OS</h1>
        <p>Loading...</p>
    </div>

    <!-- Main Desktop Environment -->
    <div id="desktop">
        <!-- Theme Changer Window -->
        <div id="theme-window" class="window" style="top: 50px; left: 50px;">
            <div class="window-header">
                <span>Theme Center</span>
                <div class="window-controls">
                    <button class="btn btn-min" onclick="toggleWindow('theme-window', 'min')"></button>
                    <button class="btn btn-max" onclick="toggleWindow('theme-window', 'max')"></button>
                    <button class="btn btn-close"></button>
                </div>
            </div>
            <div style="padding: 20px; color: white;">
                <button onclick="randomizeTheme()">Randomize (854 variants)</button>
                <p id="hex-info">#000000 -> #BC13FE</p>
            </div>
        </div>

        <!-- Start Menu -->
        <div id="start-menu" class="window">
            <div class="window-header">
                <span>Start Menu</span>
                <div class="window-controls">
                    <button class="btn btn-max" onclick="toggleWindow('start-menu', 'max')"></button>
                </div>
            </div>
            <div style="padding: 20px; color: white;">
                <h3>Fanmade-EtherealOS</h3>
                <hr style="margin: 10px 0; border-color: var(--bg-color);">
                <p>Pinned Apps</p>
                <div style="margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div style="padding: 10px; border: 1px solid #333;">Terminal</div>
                    <div style="padding: 10px; border: 1px solid #333;">Browser</div>
                </div>
            </div>
        </div>

        <!-- Taskbar -->
        <div class="taskbar">
            <div class="start-btn" onclick="toggleStart()">START</div>
            <div style="color: white; font-size: 12px;" id="clock"></div>
        </div>
    </div>

    <!-- Audio assets -->
    <audio id="snd-startup" src="https://pixabay.com/sound-effects/musical-startup-sound-variation-2-315893/"></audio>
    <audio id="snd-click" src="https://pixabay.com/sound-effects/film-special-effects-mouse-click-290204/"></audio>

    <script>
        // 1. Boot Logic (3 Seconds)
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                document.getElementById('desktop').style.display = 'block';
                // Attempt to play startup sound (requires user interaction first usually)
                document.getElementById('snd-startup').play().catch(()=>{
                    console.log("Startup sound waiting for user click.");
                });
            }, 3000);
        });

        // 2. Random Fonts
        const fonts = ['Arial', 'Courier New', 'Impact', 'Verdana', 'Londrina Solid', 'Segoe UI', 'Roboto', 'Noto Serif'];
        document.body.style.fontFamily = fonts[Math.floor(Math.random() * fonts.length)];

        // 3. Window Management
        function toggleWindow(id, type) {
            playClick();
            const win = document.getElementById(id);
            if(type === 'max') win.classList.toggle('maximized');
            if(type === 'min') win.classList.toggle('minimized');
        }

        // 4. Start Menu Logic
        function toggleStart() {
            playClick();
            document.getElementById('start-menu').classList.toggle('open');
        }

        // 5. Sound & Theme Helpers
        function playClick() {
            const click = document.getElementById('snd-click');
            click.currentTime = 0;
            click.play().catch(()=>{});
        }

        function randomizeTheme() {
            playClick();
            const color = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.documentElement.style.setProperty('--bg-color', color);
            document.getElementById('hex-info').innerText = `#000000 -> ${color}`;
        }

        // Clock Update
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
