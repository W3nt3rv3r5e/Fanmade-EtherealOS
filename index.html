<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fanmade-EtherealOS | Desktop Mockup</title>
    <style>
        :root {
            --bg-color: #BC13FE; /* Default Purple */
            --bg-detail: #000000; /* Detail Black */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Applying the rodless cursor from your assets directory */
            cursor: url('assets/ui/cursor.svg') 3 2, auto;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, var(--bg-detail) 0%, var(--bg-color) 100%);
            transition: background 0.5s ease;
        }

        /* Taskbar */
        .taskbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 45px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        /* Theme Changer App (Left & Up) */
        #theme-app {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 80px;
            text-align: center;
            color: white;
            user-select: none;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #BC13FE;
            border-radius: 12px;
            margin-bottom: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        /* Theme Ball Container */
        #theme-overlay {
            display: none;
            position: absolute;
            top: 100px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #BC13FE;
        }

        .theme-ball {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-block;
            margin: 5px;
            border: 2px solid white;
            transition: transform 0.2s;
        }

        .theme-ball:hover {
            transform: scale(1.2);
        }

        /* Controls */
        .controls {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #444;
        }

        button {
            background: #BC13FE;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
        }

        #hex-display {
            font-family: monospace;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }
    </style>
</head>
<body>

    <div id="theme-app" ondblclick="toggleThemeMenu()">
        <div class="app-icon">🎨</div>
        <p>Themes</p>
    </div>

    <div id="theme-overlay">
        <div id="balls-container">
            <!-- Theme balls generated by JS -->
        </div>
        <div class="controls">
            <button onclick="randomizeTheme()">Theme Randomizer</button>
            <span id="hex-display">#000000 -> #BC13FE</span>
            <p style="font-size: 10px; margin-top: 10px;">854 Variants Available</p>
        </div>
    </div>

    <div class="taskbar">
        <span style="color: #BC13FE; font-weight: bold;">EtherealOS</span>
    </div>

    <audio id="startup-sound" src="https://www.soundjay.com/buttons/sounds/button-20.mp3"></audio>
    <audio id="click-sound" src="https://www.soundjay.com/buttons/sounds/button-50.mp3"></audio>

    <script>
        // 1. Random Fonts on Refresh
        const fonts = ['Arial', 'Courier New', 'Georgia', 'Impact', 'Trebuchet MS', 'Verdana'];
        document.body.style.fontFamily = fonts[Math.floor(Math.random() * fonts.length)];

        // 2. Play Startup Sound
        window.addEventListener('click', () => {
            const audio = document.getElementById('startup-sound');
            if (audio.paused) audio.play();
        }, { once: true });

        function toggleThemeMenu() {
            document.getElementById('click-sound').play();
            const overlay = document.getElementById('theme-overlay');
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
            if(overlay.style.display === 'block') generateBalls();
        }

        // 3. Generate Theme Balls
        function generateBalls() {
            const container = document.getElementById('balls-container');
            container.innerHTML = '';
            for(let i=0; i<8; i++) {
                let ball = document.createElement('div');
                ball.className = 'theme-ball';
                let randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
                ball.style.background = `linear-gradient(black, ${randomColor})`;
                ball.onclick = () => applyTheme('#000000', randomColor);
                container.appendChild(ball);
            }
        }

        // 4. Randomizer Logic (Hex between black and random)
        function randomizeTheme() {
            document.getElementById('click-sound').play();
            const randomHex = '#' + Math.floor(Math.random()*16777215).toString(16);
            applyTheme('#000000', randomHex);
        }

        function applyTheme(detail, color) {
            document.documentElement.style.setProperty('--bg-detail', detail);
            document.documentElement.style.setProperty('--bg-color', color);
            document.getElementById('hex-display').innerText = `${detail} -> ${color}`;
        }
    </script>
</body>
</html>
